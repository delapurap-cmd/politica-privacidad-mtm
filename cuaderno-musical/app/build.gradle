plugins { id 'com.android.application' }

android {
    namespace 'com.camiloperdomo.cuadernomusical'
    compileSdk 35
    defaultConfig {
        applicationId 'com.camiloperdomo.cuadernomusical'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.6.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        reper {
            storeFile file('reper-release.jks')
            storePassword 'reper-local-2026'
            keyAlias 'reper'
            keyPassword 'reper-local-2026'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.reper }
        release {
            signingConfig signingConfigs.reper
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
