<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cuaderno</title>
<style>
:root{
  --desk:#14161a; --desk-hi:#1c1f25;
  --paper:#fcfbf7; --ink:#191b1f; --soft:#6f7481;
  --hair:rgba(255,255,255,.09); --margin:#c8b28a; --accent:#2c3e63;
  --lift:0 1px 0 rgba(255,255,255,.55) inset, 0 20px 44px rgba(0,0,0,.46), 0 3px 10px rgba(0,0,0,.3);
  --pill:rgba(252,251,247,.93);
  --ease:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 50% -10%,var(--desk-hi),var(--desk) 60%);
  color:#e8e7e3;font:400 15px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

#top{height:44px;flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--hair)}
#top button{opacity:.45;padding:9px;transition:opacity .2s}
#top button:active,#top button:hover{opacity:1}
#top button[disabled]{opacity:.14}
#tPlayer.on{opacity:1;color:#d6b36a}
#count{margin:0 auto;font:400 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.28em;opacity:.4}
#dot{width:5px;height:5px;border-radius:9px;background:#7fbf8f;opacity:0;transition:opacity .4s;margin-left:4px}
#dot.on{opacity:.75}

#scroller{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  scroll-behavior:smooth;touch-action:pan-y;overscroll-behavior-x:none}
#scroller::-webkit-scrollbar{display:none}
.slot{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:start center;padding:14px 26px 0}
.paper{position:relative;background:var(--paper);border-radius:5px 5px 0 0;box-shadow:var(--lift);
  width:min(660px,100%);height:100%;overflow:hidden;--pat:rgba(0,0,0,.085);--pat2:rgba(0,0,0,.22)}
.sheet{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;touch-action:pan-y}
.sheet::-webkit-scrollbar{width:0}
.doc{position:relative;width:100%}
.doc::before{content:"";position:absolute;top:0;bottom:0;left:34px;width:1px;background:var(--margin);opacity:.5}
.doc[data-s="ruled"]{background-image:repeating-linear-gradient(to bottom,transparent 0 28px,var(--pat) 28px 29px);background-position:0 33px}
.doc[data-s="grid"]{background-image:repeating-linear-gradient(to bottom,transparent 0 24px,var(--pat) 24px 25px),repeating-linear-gradient(to right,transparent 0 24px,var(--pat) 24px 25px);background-position:0 33px}
.doc[data-s="dots"]{background-image:radial-gradient(var(--pat2) 1.3px,transparent 1.4px);background-size:23px 23px;background-position:12px 33px}
.paper[data-s="plain"] .doc::before,.paper[data-s="dark"] .doc::before{opacity:.22}
.paper[data-s="dark"]{--paper:#15171b;--ink:#e9e8e4;--margin:#5b5f6a;--pat:rgba(255,255,255,.1);--pat2:rgba(255,255,255,.22);
  box-shadow:0 0 0 1px rgba(255,255,255,.07),0 20px 44px rgba(0,0,0,.5)}
.paper[data-s="dark"] .doc::after{opacity:.1}
.paper[data-s="dark"] .ink{mix-blend-mode:normal}
.doc::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.05'/></svg>")}
.editor{position:relative;z-index:1;outline:none;color:var(--ink);padding:34px 26px 40px 52px;
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;
  font-size:17px;line-height:1.7;user-select:text;-webkit-user-select:text}
.editor:empty::before{content:attr(data-ph);color:var(--ink);opacity:.3;font-style:italic}
.editor h2{font-size:1.35em;font-weight:600;letter-spacing:-.01em;margin:.8em 0 .3em}
.editor blockquote{margin:.7em 0;padding-left:.9em;border-left:2px solid var(--margin);color:var(--ink);opacity:.72;font-style:italic}
.editor ul,.editor ol{padding-left:1.35em;margin:.5em 0}
.editor img{max-width:100%;height:auto;border-radius:3px;margin:.5em 0;display:block}
.ink{position:absolute;top:0;left:0;width:100%;z-index:2;mix-blend-mode:multiply}
body[data-mode="text"] .ink{pointer-events:none}
body[data-mode="ink"] .ink{touch-action:none}
body[data-mode="ink"] .editor{pointer-events:none;user-select:none}

#dockwrap{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;touch-action:none}
#dockwrap.free{transform:none}
#dock{display:flex;align-items:center;gap:3px;padding:5px;height:46px;background:var(--pill);color:var(--ink);
  border-radius:999px;box-shadow:0 12px 32px rgba(0,0,0,.42);backdrop-filter:blur(14px)}
#dock button{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;transition:background .18s}
#dock button:active{background:#0000000f}
#dock button.on{background:var(--ink);color:var(--paper)}
#grip{width:16px!important;opacity:.28;cursor:grab;touch-action:none;letter-spacing:-2px;font-size:13px}
#grip:active{opacity:.7;cursor:grabbing}
#inkbar{display:none;align-items:center;gap:3px}
body[data-mode="ink"] #inkbar{display:flex}
body[data-mode="ink"] #textbar{display:none}
#textbar{display:flex;align-items:center;gap:3px}
.swatch{width:15px;height:15px;border-radius:999px;box-shadow:0 0 0 1px #0002}
.div{width:1px;height:20px;background:#0000001a;margin:0 3px}

#pop{position:absolute;bottom:calc(100% + 9px);left:50%;z-index:2;
  transform:translateX(-50%) translateY(8px) scale(.94);transform-origin:bottom center;
  opacity:0;pointer-events:none;transition:transform .24s var(--ease),opacity .18s;
  background:var(--pill);color:var(--ink);border-radius:18px;padding:9px 10px;
  box-shadow:0 14px 34px rgba(0,0,0,.42);backdrop-filter:blur(14px);
  display:flex;flex-direction:column;gap:6px}
#pop.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
#dockwrap.below #pop{bottom:auto;top:calc(100% + 9px);transform-origin:top center}
.prow{display:flex;align-items:center;justify-content:center;gap:4px}
.prow+.prow{border-top:1px solid #0000000f;padding-top:7px}
.prow button{width:34px;height:34px;border-radius:999px;display:grid;place-items:center}
.prow button.on{background:#00000010}
.prow button.on .swatch{box-shadow:0 0 0 1.5px var(--pill),0 0 0 3px var(--ink)}
.wdot{background:currentColor;border-radius:999px;opacity:.85}

#fmt{position:fixed;z-index:50;display:none;flex-direction:column;gap:4px;padding:5px;background:var(--ink);
  color:#f4f3ef;border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.5);max-width:calc(100vw - 16px)}
#fmt.on{display:flex}
.frow{display:flex;align-items:center;gap:2px}
.frow button{min-width:32px;height:30px;padding:0 6px;border-radius:7px;display:grid;place-items:center;font-size:14px;white-space:nowrap}
.frow button:active,.frow button.on{background:#ffffff20}
#fsub{display:none;border-top:1px solid #ffffff1f;padding-top:4px;flex-wrap:wrap;justify-content:center}
#fsub.on{display:flex}
#fmt .b{font-weight:700}#fmt .i{font-style:italic;font-family:Georgia,serif}
#fmt .u{text-decoration:underline}#fmt .st{text-decoration:line-through}
.tsw{width:15px;height:15px;border-radius:999px;box-shadow:0 0 0 1px #ffffff44}

#idx{position:fixed;inset:0;z-index:60;display:none;background:rgba(10,11,13,.55);backdrop-filter:blur(3px)}
#idx.open{display:block}
#panel{position:absolute;left:0;top:0;bottom:0;width:min(360px,88vw);background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.5)}
#panel h2{margin:0;padding:20px 18px 12px;font:500 10px/1 ui-monospace,monospace;letter-spacing:.3em;
  text-transform:uppercase;color:var(--soft)}
#list{flex:1;overflow:auto;padding:0 10px 10px}
.row{display:flex;align-items:center;gap:10px;padding:12px 8px;background:var(--paper);border-radius:9px;border-bottom:1px solid #0000000d}
.row.dragging{box-shadow:0 12px 26px rgba(0,0,0,.22);border-bottom-color:transparent}
.row .n{font:400 11px/1 ui-monospace,monospace;color:var(--accent);width:20px;opacity:.8}
.row .s{flex:1;font-family:"Iowan Old Style",Georgia,serif;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .s.empty{opacity:.3;font-style:italic}
.row .grip{padding:6px;color:var(--soft);opacity:.5;touch-action:none;font-size:14px}
.row .x{padding:6px;color:var(--soft);opacity:.5;font-size:15px}
.prow.chips{flex-wrap:wrap;max-width:230px}
.prow.chips button{width:auto;padding:0 11px;height:32px;border-radius:999px;font-size:12px;
  background:#00000009;box-shadow:inset 0 0 0 1px #0000000f}
.prow.chips button.on{background:var(--ink);color:var(--paper);box-shadow:none}
#panel footer{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-top:1px solid #0000000d}
#panel footer button{flex:1;padding:11px;border-radius:10px;background:#0000000a;font-size:12.5px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 16px;
  border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:80}
#toast.on{opacity:1}
.linkchip{position:absolute;top:9px;right:11px;z-index:4;display:none;align-items:center;gap:5px;
  padding:5px 10px;border-radius:999px;font-size:11.5px;letter-spacing:.02em;
  background:var(--ink);color:var(--paper);opacity:.82;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.linkchip.on{display:flex}
.linkchip:active{opacity:1}
.row .lk{padding:6px;color:var(--soft);opacity:.55;font-size:14px}
.row .trackact{min-width:70px;padding:6px 8px;border-radius:999px;background:var(--accent);color:#fff;
  font:600 10px/1 ui-sans-serif,sans-serif;white-space:nowrap}
.row .trackact.ready{background:#e7f1e9;color:#267044}
.row .trackact.busy{background:#eee7d5;color:#755d25}
.lkin{flex:1;min-width:0;border:0;background:#00000010;padding:9px 10px;border-radius:8px;
  font:400 12.5px ui-monospace,monospace;color:var(--ink)}
.editor a,.tbox a{color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;font-size:.9em}
.paper[data-s="dark"] .editor a{color:#8fb6ff}
.zoomer{transform-origin:top center;width:100%}
.tbox{position:absolute;z-index:1;min-height:1.4em;outline:none;padding:2px 5px;border-radius:3px;
  color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;
  font-size:17px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  user-select:text;-webkit-user-select:text}
.tbox:empty::before{content:attr(data-ph);color:var(--ink);opacity:.28;font-style:italic}
.tbox.sel{box-shadow:0 0 0 1px var(--margin)}
.tbox .bh,.tbox .br{position:absolute;display:none;background:var(--accent);border-radius:999px;touch-action:none}
.tbox .bh{top:-10px;left:-10px;width:20px;height:20px;cursor:move}
.tbox .br{bottom:-8px;right:-8px;width:16px;height:16px;border-radius:4px;cursor:ew-resize}
.tbox.sel .bh,.tbox.sel .br{display:block}
body[data-lock="1"] .editor,body[data-lock="1"] .tbox,body[data-lock="1"] .ink{pointer-events:none!important}
body[data-lock="1"] .tbox.sel{box-shadow:none}
.row .s{font-weight:700}
#fgrip{cursor:grab;opacity:.4;touch-action:none;letter-spacing:-2px;min-width:20px!important}
#fgrip:active{opacity:.9;cursor:grabbing}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ═══ reproductor de ensayo ═══ */
body.player-open #scroller{padding-bottom:92px}
body.player-open #dockwrap{bottom:102px}
#player{position:fixed;left:0;right:0;bottom:0;z-index:45;height:92px;padding:4px 8px max(4px,env(safe-area-inset-bottom));
  background:rgba(18,20,24,.97);border-top:1px solid #ffffff16;box-shadow:0 -12px 34px #0007;backdrop-filter:blur(18px);display:none}
body.player-open #player{display:block}
.phead{display:flex;align-items:center;gap:6px;height:20px}
#nowTitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 10.5px/1 ui-sans-serif,sans-serif;color:#f3f1eb}
#pageAction{max-width:44%;padding:4px 8px;border-radius:999px;background:#d6b36a;color:#17130b;font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pageAction:disabled{background:#ffffff12;color:#ffffff66}
.pmain{display:flex;align-items:center;gap:6px;height:34px}
.wavebox{position:relative;flex:1;height:32px;margin:0;touch-action:none}
#wave{width:100%;height:32px;display:block}
.ptime{position:absolute;left:5px;right:5px;bottom:1px;display:flex;justify-content:space-between;pointer-events:none;font:9px/1 ui-monospace,monospace;color:#ffffff8c}
#playToggle{flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:#f2efe7;color:#111;font-size:12px}
#loopToggle{flex:0 0 auto;padding:5px 7px;border-radius:7px;background:#ffffff0c;color:#ffffffa8;font:600 9px/1 ui-monospace,monospace}
#loopToggle.on{background:#d6b36a;color:#17130b}
#downloadProgress{position:absolute;left:0;right:0;top:0;height:2px;background:#ffffff12;overflow:hidden;display:none}
#downloadProgress i{display:block;width:0;height:100%;background:#d6b36a}
.adjust{height:28px;display:flex;align-items:center;justify-content:center;gap:8px;color:#ffffffa0;font:9px/1 ui-monospace,monospace}
.stepper{height:22px;display:flex;align-items:center;border:1px solid #ffffff18;border-radius:6px;background:#ffffff08;overflow:hidden}
.stepper button{width:23px;height:22px;color:#d6b36a;font:700 14px/1 ui-monospace,monospace}
.stepper output{min-width:62px;text-align:center;color:#f2efe7;font:600 8.5px/1 ui-monospace,monospace}
.downloaded{color:#2d8251!important;opacity:1!important;font-size:13px!important}
</style>
</head>
<body data-mode="text">

<div id="top">
  <button id="openIdx" title="Índice"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <span id="count">01 / 01</span><span id="dot"></span>
  <button id="bUndo" title="Deshacer"><svg viewBox="0 0 24 24"><path d="M9 10H5V6"/><path d="M5 10a8 8 0 1 1 2 6"/></svg></button>
  <button id="bRedo" title="Rehacer"><svg viewBox="0 0 24 24"><path d="M15 10h4V6"/><path d="M19 10a8 8 0 1 0-2 6"/></svg></button>
  <button id="tLock" title="Bloquear edición"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
  <button id="tPlayer" class="on" title="Abrir o cerrar reproductor">♫</button>
  <button id="addPage" title="Nueva página"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div id="scroller"></div>

<div id="player">
  <div class="phead"><div id="nowTitle">Selecciona una canción</div><button id="pageAction" disabled>Sin audio</button></div>
  <div class="pmain"><button id="playToggle">▶</button><div class="wavebox"><canvas id="wave"></canvas><div class="ptime"><span id="posTime">0:00</span><span id="durTime">0:00</span></div></div><button id="loopToggle">A–B</button></div>
  <div class="adjust"><div class="stepper"><button id="pitchDown">‹</button><output id="pitchOut">TONO 0</output><button id="pitchUp">›</button></div>
    <div class="stepper"><button id="speedDown">‹</button><output id="speedOut">VEL 1×</output><button id="speedUp">›</button></div></div>
  <div id="downloadProgress"><i></i></div>
</div>

<div id="dockwrap">
  <div id="pop"></div>
  <div id="dock">
    <button id="grip" title="Mover herramientas">⠿</button>
    <span id="textbar">
      <button id="tSheet" title="Estilo de esta hoja"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></button>
      <button id="tBox" title="Escribir donde toques"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2" stroke-dasharray="3 2.5"/><path d="M9 10h6M12 10v5"/></svg></button>
      <button id="tImg" title="Imagen"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.2"/><path d="M21 16l-5-5-9 8"/></svg></button>
      <button id="toInk" title="Anotar"><svg viewBox="0 0 24 24"><path d="M4 20l4.5-1.2L19 8.3a2 2 0 0 0 0-2.8l-.5-.5a2 2 0 0 0-2.8 0L5.2 15.5z"/></svg></button>
    </span>
    <span id="inkbar">
      <button id="toText" title="Texto"><svg viewBox="0 0 24 24"><path d="M5 6V4.5h14V6M12 4.5V19M9.5 19h5"/></svg></button>
      <span class="div"></span>
      <button id="tPen" title="Lápiz — toca otra vez para color y grosor"><span class="swatch" id="penSw"></span></button>
      <button id="tHi" title="Resaltador"><svg viewBox="0 0 24 24"><path d="M4 19h6M14 4l6 6-7.5 7.5H8L6 15.5z"/></svg></button>
      <button id="tEr" title="Borrador"><svg viewBox="0 0 24 24"><path d="M7 20h12M13 5l6 6-8 8H6l-3-3z"/></svg></button>
    </span>
  </div>
</div>

<div id="fmt">
  <div class="frow" id="fmain">
    <button id="fgrip">⠿</button>
    <button data-c="bold" class="b">B</button><button data-c="italic" class="i">I</button>
    <button data-c="underline" class="u">U</button><button data-c="strike" class="st">S</button>
    <button data-c="size">Aa</button>
    <button data-c="color"><span class="tsw" id="fsw" style="background:#e8e7e3"></span></button>
    <button data-c="mark">▮</button>
    <button data-c="more">⋯</button>
  </div>
  <div class="frow" id="fsub"></div>
</div>

<div id="idx"><div id="panel">
  <h2>Índice · arrastra ⠿ para reordenar</h2>
  <div id="list"></div>
  <footer><button id="newSong">Nueva canción</button><button id="exp">Guardar archivo</button><button id="imp">Abrir archivo</button><button id="reseed">Lista ▶</button><button id="closeIdx">Cerrar</button></footer>
</div></div>

<div id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="jsonFile" accept="application/json,.json" hidden>

<script>
/* ═══ base ═══ */
const PALETTE=["#1a1c20","#2c3e63","#a8402f","#2c6b4f","#8a5cc0"];
const DARKPAL=["#f3f2ee","#8fb6ff","#ff9a8a","#8fe3c4","#d3b3ff"];
const HICOLORS=["#f2d45c","#8fe3c4","#f6aecd"];
const PENW=[.0032,.0055,.0095], HIW=[.032,.055,.082];
const TAIL=800, MAXH=120;
let penColor=PALETTE[0], penW=PENW[1], hiColor=HICOLORS[0], hiW=HIW[1], pageStyle='ruled';
const scroller=document.getElementById('scroller'), listEl=document.getElementById('list');
const toastEl=document.getElementById('toast'), dot=document.getElementById('dot');
let pages=[], cur=0, mode='text', tool='pen', color=PALETTE[0], full=false;
const el=(t,c)=>{const n=document.createElement(t);if(c)n.className=c;return n};
const uid=()=>('song-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8));
const pageTitle=p=>((p.ed.innerText||'').trim().split(/\n/)[0]||'Canción sin título').slice(0,90);
/* almacén: artefacto de Claude o localStorage si abres el HTML descargado */
const store={
  async get(k){
    try{ if(window.storage){const r=await window.storage.get(k);return r&&r.value} }catch(e){}
    try{ return localStorage.getItem(k) }catch(e){ return null }
  },
  async set(k,v){
    if(window.storage)return window.storage.set(k,v);
    localStorage.setItem(k,v);
  }
};
const toast=m=>{toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(toastEl._i);toastEl._i=setTimeout(()=>toastEl.classList.remove('on'),1800)};

/* ═══ página ═══ */
function newPage(at=pages.length,data=null){
  const slot=el('div','slot'), paper=el('div','paper'), sheet=el('div','sheet');
  const zoomer=el('div','zoomer'), doc=el('div','doc');
  const ed=el('div','editor'); ed.dataset.ph='Escribe aquí…'; ed.spellcheck=false;
  const cv=el('canvas','ink');
  doc.append(ed,cv); zoomer.append(doc); sheet.append(zoomer); paper.append(sheet); slot.append(paper);
  const chip=el('button','linkchip'); chip.innerHTML='▶ YouTube'; paper.appendChild(chip);
  const p={id:(data&&data.id)||uid(),slot,paper,sheet,zoomer,doc,ed,cv,ctx:cv.getContext('2d'),chip,link:(data&&data.link)||'',
    strokes:[],h:0,undo:[],redo:[],last:null};
  setLink(p,p.link,true);
  if(data){ed.innerHTML=data.html||'';p.strokes=data.strokes||[]}
  setStyle(p,(data&&data.style)||pageStyle,true);
  ed.contentEditable=false;
  ed.addEventListener('pointerdown',e=>{p._tx=e.clientX;p._ty=e.clientY});
  ed.addEventListener('pointerup',e=>{
    if(mode!=='text'||locked||ed.isContentEditable)return;
    if(Math.hypot(e.clientX-(p._tx||0),e.clientY-(p._ty||0))>8)return;   // fue un scroll
    if(boxArm)return;
    ed.contentEditable=true; ed.focus();
    const r=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null;

  });
  ed.addEventListener('blur',()=>{ed.contentEditable=false;hideFmt();hideSub()});
  doc.addEventListener('pointerup',e=>{                       // caja de texto donde toques
    if(!boxArm||mode!=='text'||locked)return;
    if(e.target.closest('.tbox'))return;
    const r=doc.getBoundingClientRect(), W=r.width/zoom;
    addBox(p,{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/(r.width),w:.5,html:''},true);
    setArm(false);
  });
  (data&&data.boxes||[]).forEach(b=>addBox(p,b));
  watchImgs(p);
  bindInk(p);
  ed.addEventListener('input',()=>{reflow(p);history(p);save()});
  ed.addEventListener('paste',e=>onPaste(e,p));
  if(at>=pages.length){scroller.appendChild(slot);pages.push(p)}
  else{scroller.insertBefore(slot,pages[at].slot);pages.splice(at,0,p)}
  p.last=snap(p); reflow(p); count();
  return p;
}
function delPage(i){

  if(window.Native)Native.removeTrack(pages[i].id);

function watchImgs(p){

}
function setLink(p,url,quiet){

}
const STYLES=[['ruled','Rayado'],['grid','Cuadrícula'],['dots','Puntos'],['plain','Blanca'],['dark','Negra']];
function setStyle(p,s,quiet){
  p.style=s; pageStyle=s; p.paper.dataset.s=s; p.doc.dataset.s=s;
  const i=PALETTE.indexOf(penColor), j=DARKPAL.indexOf(penColor);

/* ═══ cajas de texto libres ═══ */
let boxArm=false, zoom=1, locked=false;
function setArm(v){boxArm=v;tBox.classList.toggle('on',v);if(v)toast('Toca la hoja donde quieres escribir')}
function layoutBoxes(p){
  const W=p.doc.clientWidth||1;
  p.doc.querySelectorAll('.tbox').forEach(b=>{
    b.style.left=(parseFloat(b.dataset.x)*W)+'px';
    b.style.top=(parseFloat(b.dataset.y)*W)+'px';
    b.style.width=(parseFloat(b.dataset.w)*W)+'px';
  });
}
function addBox(p,d,focus){
  const b=el('div','tbox'); b.dataset.x=d.x; b.dataset.y=d.y; b.dataset.w=d.w||.5;
  b.innerHTML=d.html||''; b.dataset.ph='texto…';
  const g=el('button','bh'), rz=el('button','br');
  b.append(g,rz);
  b.addEventListener('pointerup',e=>{
    if(mode!=='text'||locked||b.isContentEditable||e.target.closest('.bh,.br'))return;
    selBox(b); b.contentEditable=true; b.focus();
  });
  b.addEventListener('blur',()=>{
    b.contentEditable=false;
    if(!b.textContent.trim()){b.remove()}
    reflow(p); history(p); save();
  });
  b.addEventListener('input',()=>{reflow(p);history(p);save()});
  let m=null;
  const grab=(e,k)=>{e.stopPropagation();e.preventDefault();selBox(b);
    const W=p.doc.clientWidth;
    m={k,sx:e.clientX,sy:e.clientY,x:+b.dataset.x,y:+b.dataset.y,w:+b.dataset.w,W:W*zoom};
    e.target.setPointerCapture(e.pointerId)};
  g.addEventListener('pointerdown',e=>grab(e,'mv'));
  rz.addEventListener('pointerdown',e=>grab(e,'rz'));
  const mv=e=>{if(!m)return;e.preventDefault();
    const dx=(e.clientX-m.sx)/m.W, dy=(e.clientY-m.sy)/m.W;
    if(m.k==='rz')b.dataset.w=Math.max(.12,Math.min(1,m.w+dx));
    else{b.dataset.x=Math.max(0,Math.min(.95,m.x+dx));b.dataset.y=Math.max(0,m.y+dy)}
    layoutBoxes(p)};
  const end=()=>{if(m){m=null;reflow(p);history(p);save()}};
  [g,rz].forEach(h=>{h.addEventListener('pointermove',mv);h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end)});
  p.doc.appendChild(b); layoutBoxes(p);
  if(focus){selBox(b);b.contentEditable=true;setTimeout(()=>b.focus(),20)}
  return b;
}
function selBox(b){document.querySelectorAll('.tbox.sel').forEach(x=>{if(x!==b)x.classList.remove('sel')});b&&b.classList.add('sel')}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.tbox'))selBox(null)},true);
tBox.onclick=()=>{hidePop();setArm(!boxArm)};

/* ═══ bloqueo (solo lectura / scroll) ═══ */

/* ═══ zoom (pellizco) ═══ */
function setZoom(z){
  zoom=Math.max(.35,Math.min(2.2,z));
  pages.forEach(p=>{reflow(p);redraw(p)});
}
const pz=new Map(); let pzBase=null, zooming=false;
scroller.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return; pz.set(e.pointerId,e);
  if(pz.size===2){const[a,b]=[...pz.values()];pzBase={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:zoom}}
},true);
scroller.addEventListener('pointermove',e=>{
  if(!pz.has(e.pointerId))return; pz.set(e.pointerId,e);
  if(pz.size===2&&pzBase){const[a,b]=[...pz.values()];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(Math.abs(d-pzBase.d)>12){zooming=true;sw=null;setZoom(pzBase.z*d/pzBase.d)}}
},true);
const pzEnd=e=>{pz.delete(e.pointerId);if(pz.size<2){pzBase=null;setTimeout(()=>zooming=false,120)}};
scroller.addEventListener('pointerup',pzEnd,true); scroller.addEventListener('pointercancel',pzEnd,true);
addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(zoom-e.deltaY*.002)}},{passive:false});

/* ═══ pergamino: alto dinámico ═══ */
function reflow(p){
  const W=p.doc.clientWidth||1;
  let deep=0; p.strokes.forEach(s=>s.p.forEach(q=>{if(q[1]>deep)deep=q[1]}));
  let bDeep=0; p.doc.querySelectorAll('.tbox').forEach(b=>{
    const v=parseFloat(b.dataset.y)*W+b.offsetHeight; if(v>bDeep)bDeep=v});
  const need=Math.max(p.ed.offsetHeight, deep*W, bDeep, p.sheet.clientHeight/zoom)+TAIL;
  const h=Math.ceil(need/400)*400;
  if(h!==p.h||p.cv.width!==Math.round(W*DPR())){p.h=h;sizeCanvas(p)}
  p.doc.style.height=h+'px';
  p.zoomer.style.transform='scale('+zoom+')';
  p.zoomer.style.height=(h*zoom)+'px';
  layoutBoxes(p);
}
const DPR=()=>Math.min(devicePixelRatio||1,2);
function sizeCanvas(p){
  const W=p.doc.clientWidth||1, r=DPR();
  p.cv.width=Math.round(W*r); p.cv.height=Math.round(p.h*r);
  p.cv.style.height=p.h+'px';
  p.ctx.setTransform(r,0,0,r,0,0);
  redraw(p);
}
function redraw(p){
  const W=p.doc.clientWidth||1, c=p.ctx;
  c.clearRect(0,0,W,p.h);
  p.strokes.forEach(s=>path(c,s,W));
}
function path(c,s,W){
  c.globalAlpha=s.t==='hi'?.35:1; c.strokeStyle=s.c;
  c.lineWidth=(s.w||(s.t==='hi'?.055:.0055))*W; c.lineCap='round'; c.lineJoin='round';
  c.beginPath();
  s.p.forEach(([x,y],i)=>{const X=x*W,Y=y*W;i?c.lineTo(X,Y):c.moveTo(X,Y)});
  if(s.p.length===1)c.lineTo(s.p[0][0]*W+.01,s.p[0][1]*W);
  c.stroke(); c.globalAlpha=1;
}

/* ═══ tinta ═══ */
function bindInk(p){
  const pts=new Map(); let live=null, pan=null;
  const loc=e=>{const r=p.cv.getBoundingClientRect(),W=r.width;return[(e.clientX-r.left)/W,(e.clientY-r.top)/W]};
  p.cv.addEventListener('pointerdown',e=>{
    if(mode!=='ink')return; e.preventDefault();
    pts.set(e.pointerId,e);
    if(pts.size>1){ if(live){p.strokes.pop();live=null;redraw(p)} pan={y:e.clientY,x:e.clientX,top:p.sheet.scrollTop,done:0}; return }
    p.cv.setPointerCapture(e.pointerId);
    const q=loc(e);
    if(tool==='er')return erase(p,q);
    live={t:tool,c:tool==='hi'?hiColor:penColor,w:tool==='hi'?hiW:penW,p:[q]}; p.strokes.push(live);
    drawSeg(p);
  });
  p.cv.addEventListener('pointermove',e=>{
    if(mode!=='ink'||!pts.has(e.pointerId))return; e.preventDefault();
    pts.set(e.pointerId,e);
    if(pan&&pts.size>1){
      if(zooming)return;
      const dx=e.clientX-pan.x, dy=e.clientY-pan.y;
      if(!pan.done&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.4){pan.done=1;goto(cur+(dx<0?1:-1));return}
      if(!pan.done)p.sheet.scrollTop=pan.top-dy;
      return;
    }
    const q=loc(e);
    if(tool==='er')return erase(p,q);
    if(!live)return;
    live.p.push(q); drawSeg(p);
    if(q[1]*p.doc.clientWidth>p.h-300)reflow(p);
  });
  const up=e=>{
    pts.delete(e.pointerId); if(pts.size===0)pan=null;
    if(live||p._erased){live=null;p._erased=false;reflow(p);history(p);save()}
  };
  p.cv.addEventListener('pointerup',up); p.cv.addEventListener('pointercancel',up);
  function drawSeg(){
    const W=p.doc.clientWidth,c=p.ctx,n=live.p.length;
    if(n<2)return path(c,live,W);
    const a=live.p[n-2],b=live.p[n-1];
    c.globalAlpha=live.t==='hi'?.35:1;c.strokeStyle=live.c;
    c.lineWidth=(live.w||.0055)*W;c.lineCap='round';c.lineJoin='round';
    c.beginPath();c.moveTo(a[0]*W,a[1]*W);c.lineTo(b[0]*W,b[1]*W);c.stroke();c.globalAlpha=1;
  }
}
function erase(p,q){
  const r=.03, before=p.strokes.length;
  p.strokes=p.strokes.filter(s=>!s.p.some(([x,y])=>Math.hypot(x-q[0],y-q[1])<r));
  if(p.strokes.length!==before){p._erased=true;redraw(p)}
}

/* ═══ historial (texto + tinta) ═══ */
const snap=p=>JSON.stringify({h:p.ed.innerHTML,s:p.strokes,b:boxData(p)});
let hT;
function history(p){
  clearTimeout(hT); hT=setTimeout(()=>{
    const s=snap(p); if(s===p.last)return;
    p.undo.push(p.last); if(p.undo.length>MAXH)p.undo.shift();
    p.last=s; p.redo=[]; btns();
  },450);
}
function apply(p,s){
  const d=JSON.parse(s); p.ed.innerHTML=d.h; p.strokes=d.s;
  p.doc.querySelectorAll('.tbox').forEach(b=>b.remove());
  (d.b||[]).forEach(b=>addBox(p,b));
  watchImgs(p); reflow(p); redraw(p); buildIndex(); save(); btns();
}
function doUndo(){const p=pages[cur];clearTimeout(hT);if(!p.undo.length)return toast('Nada que deshacer');
  p.redo.push(p.last);p.last=p.undo.pop();apply(p,p.last)}
function doRedo(){const p=pages[cur];if(!p.redo.length)return toast('Nada que rehacer');
  p.undo.push(p.last);p.last=p.redo.pop();apply(p,p.last)}
function btns(){const p=pages[cur];if(!p)return;
  bUndo.disabled=!p.undo.length;bRedo.disabled=!p.redo.length}
bUndo.onclick=doUndo; bRedo.onclick=doRedo;
addEventListener('keydown',e=>{
  if(!(e.metaKey||e.ctrlKey))return;
  if(e.key==='z'&&!e.shiftKey){e.preventDefault();doUndo()}
  if(e.key==='y'||(e.key==='z'&&e.shiftKey)){e.preventDefault();doRedo()}
});

/* ═══ navegación ═══ */
function count(){document.getElementById('count').textContent=String(cur+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');btns();updatePlayerPage()}
function goto(i){cur=Math.max(0,Math.min(pages.length-1,i));pages[cur].slot.scrollIntoView({inline:'center',block:'nearest'});count()}
scroller.addEventListener('scroll',()=>{const i=Math.round(scroller.scrollLeft/scroller.clientWidth);if(i!==cur){cur=i;count();hideFmt()}},{passive:true});
/* deslizado horizontal propio: funciona desde el centro de la hoja,
   sin pelear con el gesto de "atrás" del borde del teléfono */
let sw=null;
scroller.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'||mode!=='text')return;
  const ed=pages[cur]&&pages[cur].ed;
  if(ed&&ed.isContentEditable&&e.target.closest('.editor'))return;   // escribiendo: no interferir
  sw={id:e.pointerId,x:e.clientX,y:e.clientY,done:0};
});

/* trackpad / rueda horizontal (o Shift+rueda) cambia de página */
let wheelLock=0;
addEventListener('wheel',e=>{

  if(Math.abs(h)<18||Math.abs(h)<Math.abs(e.deltaY)&&!e.shiftKey)return;

/* ═══ modos ═══ */
const pop=document.getElementById('pop'), wrap=document.getElementById('dockwrap');

function pick(t){

  ({pen:tPen,hi:tHi,er:tEr})[t].classList.add('on');

/* ═══ formato flotante ═══ */
const fmt=document.getElementById('fmt'), fsub=document.getElementById('fsub');
const TCOLORS=["#1a1c20","#2c3e63","#a8402f","#2c6b4f","#8a5cc0","#c07d20"];
const TSIZES=[['S','.85em'],['M','1em'],['L','1.35em'],['XL','1.8em']];
const hideSub=()=>{fsub.classList.remove('on');document.querySelectorAll('#fmain button').forEach(b=>b.classList.remove('on'))};
const hideFmt=()=>{fmt.classList.remove('on');hideSub()};
document.addEventListener('selectionchange',()=>{
  if(mode!=='text')return hideFmt();
  const s=getSelection(); if(!s||s.isCollapsed||!s.rangeCount)return hideFmt();
  const n=s.anchorNode; if(!n||!(n.nodeType===1?n:n.parentElement)?.closest('.editor,.tbox'))return hideFmt();

function exec(c,v){document.execCommand('styleWithCSS',false,true);document.execCommand(c,false,v);after()}
function after(){const p=pages[cur];watchImgs(p);reflow(p);history(p);save()}
function setSize(v){

function sub(kind,btn){
  if(fsub.classList.contains('on')&&fsub.dataset.k===kind)return hideSub();
  hideSub(); fsub.dataset.k=kind; fsub.innerHTML=''; btn.classList.add('on');
  const add=(html,fn)=>{const b=el('button');b.innerHTML=html;b.onclick=fn;fsub.appendChild(b)};
  if(kind==='size')TSIZES.forEach(([l,v])=>add(l,()=>setSize(v)));
  if(kind==='color'){
    TCOLORS.forEach(c=>add(`<span class="tsw" style="background:${c}"></span>`,
      ()=>{document.getElementById('fsw').style.background=c;exec('foreColor',c)}));
    add('✕',()=>exec('removeFormat'));
  }
  if(kind==='more'){
    add('H',()=>exec('formatBlock','<h2>')); add('¶',()=>exec('formatBlock','<div>'));
    add('❝',()=>exec('formatBlock','<blockquote>'));
    add('•',()=>exec('insertUnorderedList')); add('1.',()=>exec('insertOrderedList'));
    add('⌫',()=>exec('removeFormat'));
  }
  fsub.classList.add('on');
}
fmt.addEventListener('click',e=>{

  if(c==='size'||c==='color'||c==='more')return sub(c,b);
  const m={bold:['bold'],italic:['italic'],underline:['underline'],strike:['strikeThrough'],
    mark:['hiliteColor','#f7e79a']}[c];

});

/* ═══ imágenes / pegar ═══ */
function insertImg(p,src){
  if(mode!=='text')setMode('text');
  p.ed.focus();
  const s=getSelection(); let r=null;
  if(s&&s.rangeCount){const t=s.getRangeAt(0);if(p.ed.contains(t.commonAncestorContainer))r=t}
  if(!r){r=document.createRange();r.selectNodeContents(p.ed);r.collapse(false);s.removeAllRanges();s.addRange(r)}
  const img=document.createElement('img'); img.src=src;
  const br=document.createElement('div'); br.innerHTML='<br>';
  r.deleteContents(); r.insertNode(img); img.after(br);
  r.setStartAfter(br); r.collapse(true); s.removeAllRanges(); s.addRange(r);
  img.addEventListener('load',()=>{reflow(p);redraw(p);save()});
  watchImgs(p); reflow(p); history(p); save();
}
function readImg(p,f){
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const max=1400, k=Math.min(1,max/im.naturalWidth);
      let out=fr.result;
      if(k<1||fr.result.length>400000){
        const c=document.createElement('canvas');
        c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        const png=/png|webp|gif/.test(f.type);
        try{const d=c.toDataURL(png?'image/png':'image/jpeg',.85); if(d.length<out.length)out=d}catch(e){}
      }
      insertImg(p,out);
    };
    im.onerror=()=>insertImg(p,fr.result);
    im.src=fr.result;
  };
  fr.readAsDataURL(f);
}
tImg.onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(f)readImg(pages[cur],f);e.target.value=''};
function onPaste(e,p){
  const it=[...(e.clipboardData?.items||[])], img=it.find(i=>i.type.startsWith('image/'));
  if(img){e.preventDefault();readImg(p,img.getAsFile());return}
  const t=e.clipboardData?.getData('text/plain');
  if(t!=null){e.preventDefault();document.execCommand('insertText',false,t);reflow(p);history(p);save()}
}

/* ═══ audio de ensayo ═══ */
let engineReady=!!(window.Native&&Native.isEngineReady&&Native.isEngineReady()), now={id:'',title:'',position:0,duration:0,playing:false,wave:[]};
let loopOn=false, pointA=0, pointB=0, waveDrag='';
const wave=document.getElementById('wave'), wctx=wave.getContext('2d');
const fmtTime=ms=>{const s=Math.max(0,Math.floor((ms||0)/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function trackState(p){
  if(!p||!window.Native)return {};
  try{return JSON.parse(Native.getTrackState(p.id)||'{}')}catch(e){return {}}
}
function refreshTrack(p){
  if(!p||!p.chip)return;
  p.chip.classList.remove('on');
  if(p===pages[cur])updatePlayerPage();
}
function validYoutube(url){return /^https?:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(url||'')}
const downloadJobs={};
function downloadPage(p){
  if(!p||!p.link)return toast('Agrega primero el enlace de YouTube');
  if(!validYoutube(p.link))return toast('Este proyecto acepta enlaces de YouTube');
  if(!window.Native)return toast('La descarga solo funciona dentro de la app Android');
  downloadJobs[p.id]={state:'downloading',progress:0};
  downloadProgress.style.display='block';downloadProgress.firstElementChild.style.width='2%';
  updateIndexTrack(p);toast(engineReady?'Preparando descarga…':'Preparando motor y descarga…');
  Native.download(p.id,p.link,pageTitle(p));
}
function playPage(p){
  const st=trackState(p);
  if(!st.downloaded)return downloadPage(p);
  now.wave=st.wave||[]; now.duration=st.duration||0; pointA=0;pointB=now.duration;loopOn=false;
  loopToggle.classList.remove('on');drawWave();Native.play(p.id,pageTitle(p));
}
function updatePlayerPage(){
  if(!pages.length)return;
  const p=pages[cur], st=trackState(p), different=now.id&&now.id!==p.id;
  nowTitle.textContent=now.id?('Suena · '+now.title):pageTitle(p);
  playToggle.textContent=now.playing?'❚❚':'▶';
  if(different){
    pageAction.style.display='block';pageAction.disabled=!st.downloaded;
    pageAction.textContent=st.downloaded?('▶ '+pageTitle(p)):'Audio no descargado';
    pageAction.onclick=()=>playPage(p);
  }else if(!now.id){
    pageAction.style.display='block';pageAction.disabled=!st.downloaded;
    pageAction.textContent=st.downloaded?'▶ Reproducir':'Audio no descargado';
    pageAction.onclick=()=>playPage(p);
  }else{
    pageAction.style.display='none';
  }
  refreshClock();drawWave();
}
function refreshClock(){posTime.textContent=fmtTime(now.position);durTime.textContent=fmtTime(now.duration)}
playToggle.onclick=()=>{
  if(now.id)Native.toggle();
  else if(pages[cur])playPage(pages[cur]);
};
loopToggle.onclick=()=>{
  if(!now.id||!now.duration)return toast('Reproduce una canción primero');
  loopOn=!loopOn;
  if(loopOn&&pointB<=pointA){pointA=now.position;pointB=Math.min(now.duration,pointA+30000)}
  if(loopOn&&pointA===0&&pointB===now.duration){pointA=now.position;pointB=Math.min(now.duration,pointA+30000)}
  loopToggle.classList.toggle('on',loopOn);Native.setLoop(pointA,pointB,loopOn);drawWave();
};
let pitchValue=0,speedValue=1;
function changePitch(delta){pitchValue=Math.max(-6,Math.min(6,pitchValue+delta));pitchOut.value='TONO '+(pitchValue>0?'+':'')+pitchValue;if(window.Native)Native.setPitch(pitchValue)}
function changeSpeed(delta){speedValue=Math.max(.5,Math.min(1.5,Math.round((speedValue+delta)*20)/20));speedOut.value='VEL '+speedValue.toFixed(2).replace(/0$/,'').replace(/\.0$/,'')+'×';if(window.Native)Native.setSpeed(speedValue)}
pitchDown.onclick=()=>changePitch(-1);pitchUp.onclick=()=>changePitch(1);
speedDown.onclick=()=>changeSpeed(-.05);speedUp.onclick=()=>changeSpeed(.05);
tPlayer.onclick=()=>{
  const open=!document.body.classList.contains('player-open');document.body.classList.toggle('player-open',open);
  tPlayer.classList.toggle('on',open);localStorage.setItem('player.open',open?'1':'0');setTimeout(drawWave,40);
};

tPlayer.classList.toggle('on',document.body.classList.contains('player-open'));
function drawWave(){
  const dpr=devicePixelRatio||1,r=wave.getBoundingClientRect(),W=Math.max(1,Math.round(r.width*dpr)),H=Math.max(1,Math.round(r.height*dpr));
  if(wave.width!==W||wave.height!==H){wave.width=W;wave.height=H}wctx.clearRect(0,0,W,H);
  const data=now.wave&&now.wave.length?now.wave:Array.from({length:80},(_,i)=>.12+.08*Math.sin(i*.7));
  const base=H*.46;wctx.fillStyle='#777d89';
  data.forEach((v,i)=>{const x=i*W/data.length,bar=Math.max(2,v*H*.36);wctx.fillRect(x,base-bar,Math.max(1,W/data.length-1),bar*2)});
  if(now.duration){
    const px=Math.max(0,Math.min(W,now.position/now.duration*W));wctx.fillStyle='#f4f1e9';wctx.fillRect(px,2*dpr,1.5*dpr,H-12*dpr);
    if(loopOn){const ax=pointA/now.duration*W,bx=pointB/now.duration*W;wctx.fillStyle='#d6b36a24';wctx.fillRect(ax,0,bx-ax,H);
      wctx.fillStyle='#d6b36a';wctx.fillRect(ax,0,2*dpr,H);wctx.fillRect(bx-2*dpr,0,2*dpr,H)}
  }
}
function wavePoint(e){const r=wave.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*now.duration}
wave.addEventListener('pointerdown',e=>{
  if(!now.duration)return;wave.setPointerCapture(e.pointerId);const v=wavePoint(e);
  if(loopOn){waveDrag=Math.abs(v-pointA)<Math.abs(v-pointB)?'a':'b';moveWavePoint(v)}else Native.seek(v);
});
wave.addEventListener('pointermove',e=>{if(waveDrag)moveWavePoint(wavePoint(e))});
wave.addEventListener('pointerup',()=>waveDrag='');wave.addEventListener('pointercancel',()=>waveDrag='');
function moveWavePoint(v){
  if(waveDrag==='a')pointA=Math.min(v,pointB-250);else pointB=Math.max(v,pointA+250);
  Native.setLoop(pointA,pointB,loopOn);drawWave();
}
window.nativeEngineReady=()=>{engineReady=true;updatePlayerPage()};

window.nativeDownloadState=d=>{
  const p=pages.find(x=>x.id===d.id);if(!p)return;

  }else{

    if(d.state==='ready'&&p===pages[cur])updatePlayerPage();

};
window.nativePlayerState=d=>{
  const changed=d.id!==now.id;Object.assign(now,d);
  if(changed){const p=pages.find(x=>x.id===d.id),st=trackState(p);now.wave=st.wave||[];pointA=0;pointB=d.duration||st.duration||0;loopOn=false;loopToggle.classList.remove('on')}

};

function buildIndex(){
  listEl.innerHTML='';
  pages.forEach((p,i)=>{
    const r=el('div','row'); r._p=p;
    const t=(p.ed.innerText||'').trim().replace(/\s+/g,' ').slice(0,40);
    const st=trackState(p),job=downloadJobs[p.id];
    const action=job?`${Math.max(0,job.progress||0)}%`:st.downloaded?'Play':p.link?'Descargar':'Sin link';
    const actionClass=job?' busy':st.downloaded?' ready':'';
    r.innerHTML=`<button class="grip">⠿</button><span class="n">${String(i+1).padStart(2,'0')}</span>
      <span class="s${t?'':' empty'}">${t?t.replace(/</g,'&lt;'):'en blanco'}</span>
      <button class="trackact${actionClass}" ${job||(!p.link&&!st.downloaded)?'disabled':''}>${action}</button>
      <button class="lk" title="Pegar o editar enlace">🔗</button><button class="x">×</button>`;
    r.querySelector('.trackact').onclick=ev=>{
      ev.stopPropagation();
      if(st.downloaded){idx.classList.remove('open');goto(pages.indexOf(p))}
      else if(!job)downloadPage(p);
    };
    r.querySelector('.lk').onclick=ev=>{
      ev.stopPropagation();
      const inp=el('input','lkin'); inp.value=p.link||''; inp.placeholder='Pega el enlace…';
      r.innerHTML=''; r.appendChild(inp); inp.focus();
      let done=false;

      inp.addEventListener('keydown',e=>{if(e.key==='Enter')finish()});
      inp.addEventListener('blur',finish);
    };
    r.querySelector('.x').onclick=ev=>{ev.stopPropagation();delPage(pages.indexOf(p))};
    r.onclick=ev=>{if(ev.target.closest('.grip,.x,.lk,.lkin,.trackact'))return;idx.classList.remove('open');goto(pages.indexOf(p))};
    listEl.appendChild(r);
  });
}
function updateIndexTrack(p){
  const r=[...listEl.children].find(x=>x._p===p);if(!r)return;
  const b=r.querySelector('.trackact'),st=trackState(p),job=downloadJobs[p.id];if(!b)return;

  b.textContent=job?(Math.max(0,job.progress||0)+'%'):st.downloaded?'Play':p.link?'Descargar':'Sin link';
